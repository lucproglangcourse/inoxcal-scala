name: Tagged Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*) ;;
            *) echo "release tags must look like v<version>" >&2; exit 1 ;;
          esac
          test "${RELEASE_TAG#v}" = "$(sbt -batch --error 'show version' | tail -n 1)"
      - name: Run tests and coverage
        run: sbt coverage test coverageReport
      - name: Build Universal archives
        run: sbt Universal/packageBin Universal/packageZipTarball
      - name: Prepare release files
        run: |
          mkdir release
          cp target/universal/inoxcal-*.zip release/
          cp target/universal/inoxcal-*.tgz release/
          for archive in release/*.tgz; do mv "$archive" "${archive%.tgz}.tar.gz"; done
          (cd release && sha256sum inoxcal-*) > release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/

  smoke-test:
    needs: validate-and-package
    strategy:
      matrix:
        java: ['17', '21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v5
        with:
          name: release-files
          path: release
      - name: Test extracted ZIP and tar.gz archives
        run: |
          chmod +x scripts/smoke-test-package.sh
          scripts/smoke-test-package.sh release/inoxcal-*.zip
          scripts/smoke-test-package.sh release/inoxcal-*.tar.gz

  publish:
    needs: [validate-and-package, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-files
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes