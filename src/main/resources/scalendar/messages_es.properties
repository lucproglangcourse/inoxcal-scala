# Error messages.
# MessageFormat placeholders: {0} the rejected value, {1} the minimum, {2} the maximum.
error.invalid.month=Mes inválido: {0}. El mes debe estar entre {1} y {2}.
error.invalid.year=Año inválido: {0}. El año debe estar entre {1} y {2}.

# Help text
help.description=Scalendar - Una utilidad de calendario de línea de comandos similar a ncal
help.examples=Ejemplos:\n  scalendar                           # Mostrar el mes actual\n  scalendar --month 3 --year 2024     # Mostrar Marzo 2024\n  scalendar --year-view --year 2024   # Mostrar todo 2024\n  scalendar --locale es --month 3     # Mostrar Marzo de este año en español
