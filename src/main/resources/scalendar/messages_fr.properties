# French localization for Scalendar
# Month names (full)
month.1=Janvier
month.2=Février
month.3=Mars
month.4=Avril
month.5=Mai
month.6=Juin
month.7=Juillet
month.8=Août
month.9=Septembre
month.10=Octobre
month.11=Novembre
month.12=Décembre

# Day names (abbreviated)
day.0=Di
day.1=Lu
day.2=Ma
day.3=Me
day.4=Je
day.5=Ve
day.6=Sa

# Error messages.
# MessageFormat placeholders: {0} the rejected value, {1} the minimum, {2} the maximum.
# Note that these strings are rendered with MessageFormat, so the apostrophe in
# "l'année" is doubled here, unlike the help strings below.
error.invalid.month=Mois invalide: {0}. Le mois doit être entre {1} et {2}.
error.invalid.year=Année invalide: {0}. L''année doit être entre {1} et {2}.

# Help text
help.description=Scalendar - Un utilitaire de calendrier en ligne de commande similaire à ncal
help.examples=Exemples:\n  scalendar                           # Afficher le mois actuel\n  scalendar --month 3 --year 2024     # Afficher Mars 2024\n  scalendar --year-view --year 2024   # Afficher toute l'année 2024\n  scalendar --locale fr --month 3     # Afficher Mars de cette année en français
