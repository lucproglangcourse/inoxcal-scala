# Error messages.
# MessageFormat placeholders: {0} the rejected value, {1} the minimum, {2} the maximum.
error.invalid.month=Mes inválido: {0}. El mes debe estar entre {1} y {2}.
error.invalid.year=Año inválido: {0}. El año debe estar entre {1} y {2}.
error.invalid.starting-day=Día inicial inválido: {0}. El día inicial debe estar entre {1} y {2}.
error.conflicting.year=Especifique el año posicionalmente o con --year, no de ambas formas.

# Help text
help.description=Inoxcal - Una utilidad de calendario de línea de comandos similar a ncal
help.examples=Ejemplos:\n  inoxcal                           # Mostrar el mes actual\n  inoxcal 2024                      # Mostrar todo 2024\n  inoxcal --month 3 --year 2024     # Mostrar Marzo 2024\n  inoxcal --year-view --year 2024   # Mostrar todo 2024\n  inoxcal --starting-day 1 -w       # Calendario de lunes con semanas\n  inoxcal --color                   # Activar salida con colores\n  inoxcal --locale es --month 3     # Mostrar Marzo de este año en español
