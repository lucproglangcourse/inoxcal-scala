# Default English localization for Inoxcal
# Month names (full)
month.1=January
month.2=February
month.3=March
month.4=April
month.5=May
month.6=June
month.7=July
month.8=August
month.9=September
month.10=October
month.11=November
month.12=December

# Day names (abbreviated)
day.0=Su
day.1=Mo
day.2=Tu
day.3=We
day.4=Th
day.5=Fr
day.6=Sa

# Error messages.
# MessageFormat placeholders: {0} the rejected value, {1} the minimum, {2} the maximum.
# Note that these strings are rendered with MessageFormat, so a literal apostrophe
# must be doubled, unlike the month/day/help strings above.
error.invalid.month=Invalid month: {0}. Month must be between {1} and {2}.
error.invalid.year=Invalid year: {0}. Year must be between {1} and {2}.
error.invalid.starting-day=Invalid starting day: {0}. Starting day must be between {1} and {2}.
error.conflicting.year=Specify the year either positionally or with --year, not both.

# Help text
help.description=Inoxcal - A command-line calendar utility similar to ncal
help.examples=Examples:\n  inoxcal                           # Show the current month\n  inoxcal 2024                      # Show all of 2024\n  inoxcal --month 3 --year 2024     # Show March 2024\n  inoxcal --year-view --year 2024   # Show all of 2024\n  inoxcal --starting-day 1 -w       # Monday-first calendar with week numbers\n  inoxcal --color                   # Enable colored output\n  inoxcal --locale es --month 3     # Show March of this year in Spanish
